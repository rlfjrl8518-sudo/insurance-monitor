name: 전체 재분류

on:
  workflow_dispatch:
    inputs:
      all:
        description: "분류된 것까지 전부 다시 (끄면 미분류만)"
        type: boolean
        default: false

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - nam      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 전체 재분류 실행
        env:
          PYTHONUNBUFFERED: "1"
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python classify.py ${{ inputs.all && '--all' || '' }} | tee reclassify.log

      - name: Postgres 적재
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python push_to_postgres.py

      - name: 변경된 데이터 커밋
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ads.csv
          git diff --cached --quiet || git commit -m "재분류: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash -q && git push
