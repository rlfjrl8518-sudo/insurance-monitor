name: 경쟁사 광고 모니터링

on:
  schedule:
    # 정각(:00) 스케줄은 전 세계 워크플로우가 몰려 GitHub Actions 지연이 크다 —
    # 5분 오프셋으로 큐 혼잡을 피해 실제 실행 시각을 09:00/15:00 KST에 더 가깝게 맞춘다.
    - cron: "5 0 * * *" # 매일 09:05 KST (UTC 00:05)
    - cron: "5 6 * * *" # 매일 15:05 KST (UTC 06:05)
  workflow_dispatch:
    inputs:
      skip_classification:
        description: "AI 분류(2단계) 건너뛰기"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 명시적으로 bash를 지정하면 GitHub Actions가 `-eo pipefail`을 적용한다.
        # 기본 `bash -e {0}`는 pipefail이 없어서 `python x.py | tee log.txt`에서
        # python이 실패해도 tee의 종료 코드(0)만 보고 스텝이 성공 처리되는 문제가 있었음
        # (구글시트 동기화 403 에러가 이 때문에 한 달 가까이 "success"로 숨겨져 있었음).
        shell: bash
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 1단계 - 광고 수집
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DASHBOARD_WEBAPP_URL: ${{ secrets.DASHBOARD_WEBAPP_URL }}
        run: python main.py | tee collect.log

      - name: 2단계 - AI 분류
        if: ${{ inputs.skip_classification != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python classify.py | tee classify.log

      - name: 3단계 - Google Sheets 동기화
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_UPLOAD_WEBAPP_URL: ${{ secrets.DRIVE_UPLOAD_WEBAPP_URL }}
          DRIVE_UPLOAD_SECRET: ${{ secrets.DRIVE_UPLOAD_SECRET }}
          DASHBOARD_WEBAPP_URL: ${{ secrets.DASHBOARD_WEBAPP_URL }}
        run: python sync_sheets.py | tee sync.log

      - name: 실행 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 실행로그-${{ github.run_number }}
          path: |
            collect.log
            classify.log
            sync.log
          retention-days: 30

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ads.csv
          git diff --cached --quiet || git commit -m "데이터 갱신: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M %Z')"
          git push
